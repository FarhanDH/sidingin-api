# fly.toml app configuration file generated for sidingin-api on 2026-10-30T23:38:30+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sidingin-api'
primary_region = 'sin'

[build]
    dockerfile = 'Dockerfile'

[http_service]
  internal_port = 9000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
